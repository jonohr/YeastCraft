# Standalone installation with local authentication.
services:
  yeastcraft:
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: yeastcraft:local
    init: true
    read_only: true
    restart: "no"
    ports:
      - "${YEASTCRAFT_BIND_ADDRESS:-${FERMENTRACK_BIND_ADDRESS:-0.0.0.0}}:8315:8315"
    volumes:
      - rust_state:/app/state
      - ./private-import:/app/private-import:ro
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  rust_state:
