# Standalone installation with local authentication.
services:
  fermentrack-rs:
    build:
      context: .
      dockerfile: Dockerfile.rust
    image: fermentrack-rs:local
    init: true
    read_only: true
    restart: "no"
    ports:
      - "127.0.0.1:8315:8315"
    volumes:
      - rust_state:/app/state
      - ./private-import:/app/private-import:ro
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  rust_state:
